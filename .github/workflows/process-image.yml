name: CI for Image Processing
'on':
  push:
    paths:
      - input_images/**
      - invert_pixel.py
jobs:
  process-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Installing required dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Running image processing script
        run: |
          python invert_pixel.py
      - name: Save processed image
        uses: actions/upload-artifact@v4
        with:
          name: processed-images
          path: output_images/
      - name: Commit processed images
        run: >
          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"

          git add -f output_images/

          git commit -m "CI: Auto-processed images" || echo "No changes to
          commit"

          git push         