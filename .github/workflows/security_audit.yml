name: DevSecOps Full Audit

on:
  push:
    branches: [ "main", "security-integration" ]
  pull_request:
    branches: [ "main" ]

jobs:
  comprehensive-security:
    runs-on: ubuntu-latest
    steps:
      - name: "Clone Repository"
        uses: actions/checkout@v4

      - name: "Initialize Python"
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: "Install Security & Quality Tools"
        run: |
          pip install bandit flake8 safety

      - name: "1. Security Scan (SAST)"
        
        run: bandit -r . -v || true

      - name: "2. Code Quality Check"
        
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: "3. Dependency Scanning"
       
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt || true
          else
            echo "No requirements.txt found, skipping dependency scan."
          fi
