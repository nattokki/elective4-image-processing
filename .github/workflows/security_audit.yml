name: DevSecOps Full Audit

on:
  push:
    branches: [ "main", "security-integration" ]
  pull_request:
    branches: [ "main" ]

jobs:
  comprehensive-security:
    runs-on: ubuntu-latest
    steps:
      - name: "Clone Repository"
        uses: actions/checkout@v4

      - name: "Initialize Python"
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: "Install Security & Quality Tools"
        run: |
          pip install bandit flake8 safety

      - name: "1. Security Scan (SAST)"
        run: |
          bandit -r . -v > bandit-report.txt || true
          cat bandit-report.txt

      - name: "2. Code Quality Check"
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics > flake8-report.txt || true
          cat flake8-report.txt

      - name: "3. Dependency Scanning"
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt > safety-report.txt || true
          else
            echo "No requirements.txt found, skipping dependency scan." > safety-report.txt
          fi
          cat safety-report.txt

      - name: "4. Upload Security Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            bandit-report.txt
            flake8-report.txt
            safety-report.txt
